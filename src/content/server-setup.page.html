<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بيانات إعداد السيرفر — Mechatro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #081320;
      --paper: #0F2031;
      --card: #0F2031;
      --blue: #42C2EE;
      --gold: #D4A017;
      --ink: #E6EEF7;
      --muted: #94A3B8;
      --border: #1E3A57;
      --input-bg: #0B1A2A;
      --hover: rgba(66, 194, 238, 0.08);
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--navy);
      color: var(--ink);
      font-family: "Inter", "Noto Sans Arabic", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background:
        radial-gradient(circle at 10% 20%, rgba(66, 194, 238, 0.06) 0%, transparent 28%),
        radial-gradient(circle at 90% 80%, rgba(212, 160, 23, 0.04) 0%, transparent 30%),
        var(--navy);
    }

    .container {
      width: 100%;
      max-width: 720px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 96px;
      height: 96px;
      object-fit: contain;
      margin-bottom: 12px;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.25));
    }

    .brand-name {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--ink);
      margin: 0;
      letter-spacing: -0.02em;
    }

    .brand-name span { color: var(--blue); }

    .tagline {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset-inline-start: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--blue);
    }

    .card.gold::before { background: var(--gold); }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--blue);
      margin: 0 0 18px 0;
    }

    .card.gold .section-title { color: var(--gold); }

    .section-title svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .field {
      margin-bottom: 16px;
    }

    .field:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"],
    input[type="email"],
    input[type="url"] {
      width: 100%;
      padding: 12px 14px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--ink);
      font-size: 0.98rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    input::placeholder { color: rgba(148, 163, 184, 0.45); }

    input:focus {
      border-color: var(--blue);
      background: var(--paper);
      box-shadow: 0 0 0 3px rgba(66, 194, 238, 0.12);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 560px) {
      .row.two { grid-template-columns: 1fr 1fr; }
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 24px;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 12px;
      border: none;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .btn-primary {
      background: linear-gradient(135deg, var(--blue), #189FD1);
      color: #081320;
      box-shadow: 0 8px 22px rgba(66, 194, 238, 0.25);
    }

    .btn-primary:hover { box-shadow: 0 10px 28px rgba(66, 194, 238, 0.35); }

    .btn-secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--hover);
      border-color: var(--blue);
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 16px;
    }

    .copy-hint {
      display: none;
      text-align: center;
      color: var(--gold);
      font-size: 0.9rem;
      margin-top: 12px;
    }

    /* Eye toggle for password fields */
    .password-wrap { position: relative; }
    .password-wrap input { padding-inline-end: 42px; }
    .eye {
      position: absolute;
      inset-inline-end: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      color: var(--muted);
      cursor: pointer;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .eye:hover { color: var(--ink); }
    .eye svg { width: 18px; height: 18px; }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <img src="/mechatro-logo.png" alt="Mechatro Logo" class="logo" />
      <h1 class="brand-name">Mechatro <span>ميكاترو</span></h1>
      <p class="tagline">Innovative Energy Solutions</p>
    </header>

    <section class="card">
      <h2 class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
        بيانات VPS
      </h2>
      <div class="field">
        <label for="vps-ip">VPS IP Address</label>
        <input type="text" id="vps-ip" placeholder="مثال: 179.198.193.155" />
      </div>
      <div class="row two">
        <div class="field">
          <label for="vps-user">Username</label>
          <input type="text" id="vps-user" placeholder="root / ubuntu" />
        </div>
        <div class="field">
          <label for="vps-pass">Password</label>
          <div class="password-wrap">
            <input type="password" id="vps-pass" placeholder="••••••••" />
            <button type="button" class="eye" data-target="vps-pass" aria-label="إظهار كلمة المرور">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <section class="card gold">
      <h2 class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
        حساب Coolify
      </h2>
      <div class="field">
        <label for="coolify-link">Coolify Link</label>
        <input type="url" id="coolify-link" placeholder="https://coolify.your-domain.com" />
      </div>
      <div class="row two">
        <div class="field">
          <label for="coolify-email">Coolify Email</label>
          <input type="email" id="coolify-email" placeholder="admin@example.com" />
        </div>
        <div class="field">
          <label for="coolify-pass">Coolify Pass</label>
          <div class="password-wrap">
            <input type="password" id="coolify-pass" placeholder="••••••••" />
            <button type="button" class="eye" data-target="coolify-pass" aria-label="إظهار كلمة المرور">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2 class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
        رابط Dashboard
      </h2>
      <div class="field">
        <label for="dashboard-link">Dashboard Link</label>
        <input type="url" id="dashboard-link" placeholder="https://dashboard.mechatro-sy.com" />
      </div>
    </section>

    <section class="card gold">
      <h2 class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
        حساب Supabase
      </h2>
      <div class="field">
        <label for="supabase-link">Supabase Dashboard Link</label>
        <input type="url" id="supabase-link" placeholder="https://supabase.mechatro-sy.com" />
      </div>
      <div class="row two">
        <div class="field">
          <label for="supabase-user">Supabase Username</label>
          <input type="text" id="supabase-user" placeholder="supabase" />
        </div>
        <div class="field">
          <label for="supabase-pass">Supabase Password</label>
          <div class="password-wrap">
            <input type="password" id="supabase-pass" placeholder="••••••••" />
            <button type="button" class="eye" data-target="supabase-pass" aria-label="إظهار كلمة المرور">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <div class="actions">
      <button class="btn-primary" id="btn-save" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        حفظ مشفّر
      </button>
      <button class="btn-secondary" id="btn-copy" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        نسخ البيانات كـ JSON
      </button>
      <button class="btn-secondary" id="btn-clear" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        مسح الحقول
      </button>
    </div>

    <p class="copy-hint" id="copy-hint">تم نسخ البيانات إلى الحافظة.</p>
    <p class="copy-hint" id="status-hint"></p>

    <footer class="footer">
      Mechatro · البيانات محفوظة مشفّرة AES-256 — لا يمكن قراءتها إلا بكلمة المرور
    </footer>
  </main>

  <script>
    const ids = {
      vps: ["vps-ip", "vps-user", "vps-pass"],
      coolify: ["coolify-link", "coolify-email", "coolify-pass"],
      dashboard: ["dashboard-link"],
      supabase: ["supabase-link", "supabase-user", "supabase-pass"]
    };

    function buildPayload() {
      return {
        vps: {
          ipAddress: document.getElementById("vps-ip").value.trim(),
          username: document.getElementById("vps-user").value.trim(),
          password: document.getElementById("vps-pass").value
        },
        coolify: {
          link: document.getElementById("coolify-link").value.trim(),
          email: document.getElementById("coolify-email").value.trim(),
          password: document.getElementById("coolify-pass").value
        },
        dashboard: {
          link: document.getElementById("dashboard-link").value.trim()
        },
        supabase: {
          dashboardLink: document.getElementById("supabase-link").value.trim(),
          username: document.getElementById("supabase-user").value.trim(),
          password: document.getElementById("supabase-pass").value
        }
      };
    }

    document.getElementById("btn-copy").addEventListener("click", async () => {
      const payload = buildPayload();
      try {
        await navigator.clipboard.writeText(JSON.stringify(payload, null, 2));
        const hint = document.getElementById("copy-hint");
        hint.style.display = "block";
        setTimeout(() => (hint.style.display = "none"), 2000);
      } catch (err) {
        alert("تعذّر النسخ تلقائياً. يمكنك نسخ النص يدوياً من الكونسول.");
        console.log(JSON.stringify(payload, null, 2));
      }
    });

    document.getElementById("btn-clear").addEventListener("click", () => {
      Object.values(ids).flat().forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = "";
      });
    });

    document.querySelectorAll(".eye").forEach(btn => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.target);
        if (input) {
          input.type = input.type === "password" ? "text" : "password";
        }
      });
    });

    /* ---------- Encrypted vault (AES-256-GCM + PBKDF2) ---------- */

    function status(msg, color) {
      const el = document.getElementById("status-hint");
      el.textContent = msg;
      el.style.color = color || "var(--gold)";
      el.style.display = msg ? "block" : "none";
    }

    function b64(buf) {
      return btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
    }
    function unb64(str) {
      return Uint8Array.from(atob(str), c => c.charCodeAt(0));
    }

    function getKeyPhrase() {
      let p = null;
      try { p = sessionStorage.getItem("mx_setup_key"); } catch (e) {}
      if (!p) {
        p = prompt("أدخل كلمة المرور لفك تشفير البيانات:");
        if (p) { try { sessionStorage.setItem("mx_setup_key", p); } catch (e) {} }
      }
      return p;
    }

    async function deriveKey(phrase, salt) {
      const base = await crypto.subtle.importKey(
        "raw", new TextEncoder().encode(phrase), "PBKDF2", false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 250000, hash: "SHA-256" },
        base,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    function fill(payload) {
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v || ""; };
      set("vps-ip", payload.vps && payload.vps.ipAddress);
      set("vps-user", payload.vps && payload.vps.username);
      set("vps-pass", payload.vps && payload.vps.password);
      set("coolify-link", payload.coolify && payload.coolify.link);
      set("coolify-email", payload.coolify && payload.coolify.email);
      set("coolify-pass", payload.coolify && payload.coolify.password);
      set("dashboard-link", payload.dashboard && payload.dashboard.link);
      set("supabase-link", payload.supabase && payload.supabase.dashboardLink);
      set("supabase-user", payload.supabase && payload.supabase.username);
      set("supabase-pass", payload.supabase && payload.supabase.password);
    }

    async function api(body) {
      const res = await fetch(window.location.pathname, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error("request_failed");
      return res.json();
    }

    function lockFields() {
      Object.values(ids).flat().forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.readOnly = true;
        el.setAttribute("readonly", "readonly");
        el.style.opacity = "0.95";
        el.style.cursor = "text";
        el.addEventListener("focus", () => el.select());
      });
      const save = document.getElementById("btn-save");
      if (save) save.style.display = "none";
      const clear = document.getElementById("btn-clear");
      if (clear) clear.style.display = "none";
      const badge = document.getElementById("locked-badge");
      if (badge) badge.style.display = "block";
    }

    async function saveVault() {
      const phrase = getKeyPhrase();
      if (!phrase) return;
      status("جارٍ التشفير والحفظ…");
      try {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await deriveKey(phrase, salt);
        const data = new TextEncoder().encode(JSON.stringify(buildPayload()));
        const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, data);
        await api({ action: "save", ciphertext: b64(ct), iv: b64(iv), salt: b64(salt) });
        status("تم الحفظ مشفّراً ✔", "#6EE7B7");
        setTimeout(() => status(""), 2500);
      } catch (e) {
        status("تعذّر الحفظ — حدّث الصفحة وأعد المحاولة", "#FCA5A5");
      }
    }

    async function loadVault() {
      let blob;
      try {
        blob = (await api({ action: "load" })).blob;
      } catch (e) {
        status("تعذّر تحميل البيانات المحفوظة", "#FCA5A5");
        return;
      }
      if (!blob) return;
      const phrase = getKeyPhrase();
      if (!phrase) return;
      try {
        const key = await deriveKey(phrase, unb64(blob.salt));
        const plain = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: unb64(blob.iv) }, key, unb64(blob.ciphertext)
        );
        fill(JSON.parse(new TextDecoder().decode(plain)));
        status("تم فك التشفير وتحميل البيانات ✔", "#6EE7B7");
        setTimeout(() => status(""), 2500);
      } catch (e) {
        try { sessionStorage.removeItem("mx_setup_key"); } catch (err) {}
        status("كلمة المرور غير صحيحة لفك التشفير — حدّث الصفحة", "#FCA5A5");
      }
    }

    document.getElementById("btn-save").addEventListener("click", saveVault);
    loadVault();
  </script>
</body>
</html>
