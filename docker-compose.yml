# Option A: Node SSR app + nginx reverse proxy.
# Usage: docker compose up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Defaults are baked into the Dockerfile; override here only to point
        # the deployment at a different backend.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID:-}
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      # SSR / server functions read these NON-prefixed names at runtime.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_PROJECT_ID: ${SUPABASE_PROJECT_ID:-}
      PORT: "3000"
      HOST: 0.0.0.0
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-snippets:/etc/nginx/snippets:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt:ro
    restart: unless-stopped
