# Option A: Node SSR app + nginx reverse proxy.
# Usage: docker compose up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Backend defaults are baked into the Dockerfile, so no build args are
      # required. To target a different backend, add:
      #   args:
      #     VITE_SUPABASE_URL: ...
      #     VITE_SUPABASE_PUBLISHABLE_KEY: ...
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      # SSR / server functions read SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY at
      # runtime. Defaults are baked into the image; set them in .env only to
      # point this deployment at a different backend.
      PORT: "3000"
      HOST: 0.0.0.0
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-snippets:/etc/nginx/snippets:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt:ro
    restart: unless-stopped
