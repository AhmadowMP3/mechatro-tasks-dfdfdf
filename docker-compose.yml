# Option A: Node SSR app + nginx reverse proxy.
# Usage: docker compose up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Backend defaults are baked into the Dockerfile, so no build args are
      # required. To target a different backend, add:
      #   args:
      #     VITE_SUPABASE_URL: ...
      #     VITE_SUPABASE_PUBLISHABLE_KEY: ...
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      # SSR / server functions read SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY at
      # runtime. Defaults are baked into the image; set them in .env only to
      # point this deployment at a different backend.
      PORT: "3000"
      HOST: 0.0.0.0
      # Word engine for exact Word imports (server functions call it).
      GOTENBERG_URL: http://gotenberg:3000
    depends_on:
      - gotenberg
    expose:
      - "3000"
    # Coolify/Traefik routes to this container on port 3000 via the domain set
    # in the resource settings. Do not add host `ports:` here.
    restart: unless-stopped

  # Word engine (LibreOffice + Chromium) for "Import from Word" exact layout.
  # Internal only: no domain, no host ports — only the app talks to it.
  gotenberg:
    build:
      context: ./deploy/gotenberg
    # Flags (JS off, network allow-list, timeouts) live in the Dockerfile CMD.
    expose:
      - "3000"
    restart: unless-stopped

  # Only used for standalone `docker compose --profile standalone up -d --build`
  # deployments. Coolify (or any external reverse proxy) must NOT start this
  # service: it binds host ports 80/443 and collides with the proxy, which makes
  # the container fail to start.
  nginx:
    profiles: ["standalone"]
    image: nginx:alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-snippets:/etc/nginx/snippets:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt:ro
    restart: unless-stopped
