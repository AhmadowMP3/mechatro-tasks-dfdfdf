# Shared proxy block used by both the HTTP and HTTPS servers in nginx.conf.
# Mounted at /etc/nginx/snippets/app-proxy.conf

# Security headers
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Hashed build assets are immutable
location = /stale-asset-reload.js {
    proxy_pass http://mechatro_app;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
}

location /assets/ {
    proxy_pass http://mechatro_app;
    proxy_set_header Host $host;
    proxy_intercept_errors on;
    error_page 404 = /stale-asset-reload.js;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
}

# Everything else (SSR pages, server functions, /api/public/* webhooks)
location / {
    proxy_pass http://mechatro_app;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # WebSocket / SSE support
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;

    proxy_connect_timeout 10s;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
}
