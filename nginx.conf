# ---------------------------------------------------------------------------
# Option A: nginx in front of the Node SSR container (service name: app:3000)
# Mounted at /etc/nginx/conf.d/default.conf by docker-compose.yml
# ---------------------------------------------------------------------------

upstream mechatro_app {
    server app:3000;
    keepalive 32;
}

# Uploads (backup restore files, receipts) need a generous body size
client_max_body_size 64m;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain text/css text/xml application/json application/javascript
    application/xml+rss application/rss+xml font/ttf font/otf image/svg+xml;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Uncomment after issuing certificates to force HTTPS ---
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    include /etc/nginx/snippets/app-proxy.conf;
}

